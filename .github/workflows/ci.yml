name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gate as `pnpm verify` locally: format check, typecheck, unit tests,
      # the API bundled for Vercel and smoke-tested, the web export.
      - run: pnpm verify
      - run: pnpm --filter @sprint/app exec playwright install --with-deps chromium
      - name: Journeys and accessibility scan against the web export
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/app/test-results
