name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle the API for Vercel and smoke-test it
        run: pnpm --filter @sprint/server build:vercel && pnpm --filter @sprint/server smoke:vercel
      - run: pnpm --filter @sprint/app build:web
      - run: pnpm --filter @sprint/app exec playwright install --with-deps chromium
      - run: pnpm --filter @sprint/app exec playwright test e2e/journeys.spec.ts e2e/a11y.spec.ts
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/app/test-results
